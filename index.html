<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offcut</title>
  <meta name="description" content="Offcut streetwear clothing-rail hero with 3D edge-on garments, detail view, and marquee band.">
  <meta property="og:title" content="Offcut">
  <meta property="og:description" content="Offcut streetwear clothing-rail hero with 3D edge-on garments, detail view, and marquee band.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter:wght@400;500;600&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0c;
      --ink: #f1efec;
      --mute: #8d8a86;
      --red: #b3121b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      color: var(--ink);
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
      -webkit-user-select: none;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
      cursor: pointer;
    }

    /* Artboard */
    #art {
      position: absolute;
      width: 1500px;
      height: 1000px;
      transform-origin: 0 0;
      background: radial-gradient(70% 55% at 50% 40%, #18181a, #0b0b0c);
    }

    /* Shared text styles */
    .ui {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .pill {
      height: 34px;
      padding: 0 20px;
      border: 1px solid rgba(241, 239, 236, 0.6);
      border-radius: 40px;
      display: inline-grid;
      place-items: center;
      transition: background 0.25s, color 0.25s;
    }

    .pill:hover {
      background: var(--ink);
      color: var(--bg);
    }

    /* Dim / Dimmer wash-out states */
    .dim {
      transition: opacity 0.7s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.7s ease;
    }

    body.open .dim {
      opacity: 0.12;
      filter: blur(2px);
    }

    body.open .dimmer {
      opacity: 0;
      pointer-events: none;
    }

    /* Header */
    #about {
      position: absolute;
      left: 46px;
      top: 46px;
    }

    #logo {
      position: absolute;
      left: 50%;
      top: 26px;
      transform: translateX(-50%);
      font-family: "UnifrakturMaguntia", serif;
      font-weight: 400;
      font-size: 64px;
      line-height: 1;
      letter-spacing: 0.01em;
      color: var(--ink);
    }

    #contact {
      position: absolute;
      right: 46px;
      top: 46px;
    }

    /* Rail */
    #rail {
      position: absolute;
      left: 150px;
      right: 150px;
      top: 254px;
      height: 12px;
      border-radius: 6px;
      background: linear-gradient(180deg, #fafafa 0%, #b9bcc1 28%, #5d6066 55%, #a9adb3 78%, #e6e7e9 100%);
      box-shadow: 0 10px 18px rgba(0, 0, 0, 0.45);
    }

    #rail::before,
    #rail::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 30px;
      border-radius: 5px;
      top: -9px;
      background: linear-gradient(90deg, #8d9096, #f3f3f4 45%, #7a7d83);
    }

    #rail::before {
      left: -14px;
    }

    #rail::after {
      right: -14px;
    }

    /* Rack container */
    #rack {
      position: absolute;
      left: 0;
      top: 0;
      width: 1500px;
      height: 1000px;
      background: transparent;
    }

    /* Garment element */
    .g {
      position: absolute;
      top: 236px;
      width: 289px;
      height: 300px;
      margin-left: -144.5px;
      perspective: 900px;
      cursor: pointer;
      transition: left 0.75s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .g i {
      position: absolute;
      inset: 0;
      background-repeat: no-repeat;
      transform-origin: 50% 4%;
      transform: rotateY(-74deg);
      filter: brightness(0.82) drop-shadow(0 18px 18px rgba(0, 0, 0, 0.5));
      transition: transform 0.75s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.75s ease;
    }

    .g.face i {
      transform: rotateY(0deg);
      filter: brightness(1) drop-shadow(0 22px 26px rgba(0, 0, 0, 0.55));
    }

    /* Caption */
    #cap {
      position: absolute;
      top: 552px;
      transform: translateX(-50%);
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mute);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: left 0.75s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.35s ease;
    }

    #cap b {
      display: block;
      color: var(--ink);
      font-weight: 500;
      margin-bottom: 4px;
    }

    #cap.on {
      opacity: 1;
    }

    /* See availability pill */
    #avail {
      position: absolute;
      left: 50%;
      top: 790px;
      transform: translateX(-50%);
    }

    /* Red marquee band */
    #band {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 46px;
      background: var(--red);
      overflow: hidden;
      display: flex;
      align-items: center;
    }

    #band-track {
      display: flex;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: var(--ink);
      animation: marquee 22s linear infinite;
    }

    #band-track span {
      padding-right: 22px;
    }

    @keyframes marquee {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-50%);
      }
    }

    /* Detail layer */
    #det {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    body.open #det {
      pointer-events: auto;
    }

    .hit {
      position: absolute;
      inset: 0;
    }

    #big2 {
      position: absolute;
      left: 50%;
      top: 244px;
      width: 473px;
      height: 492px;
      margin-left: -236.5px;
      background-repeat: no-repeat;
      opacity: 0;
      pointer-events: none;
    }

    #big {
      position: absolute;
      left: 50%;
      top: 244px;
      width: 473px;
      height: 492px;
      margin-left: -236.5px;
      background-repeat: no-repeat;
      transform-origin: 50% 4%;
      opacity: 0;
      filter: drop-shadow(0 30px 40px rgba(0, 0, 0, 0.6));
    }

    .arr {
      position: absolute;
      top: 452px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid rgba(241, 239, 236, 0.5);
      display: grid;
      place-items: center;
      opacity: 0;
      transition: opacity 0.4s ease 0.25s, background 0.2s ease, color 0.2s ease;
      cursor: pointer;
      color: inherit;
    }

    .arr:hover {
      background: var(--ink);
      color: var(--bg);
    }

    #prev {
      left: calc(50% - 300px);
    }

    #next {
      left: calc(50% + 254px);
    }

    #info {
      position: absolute;
      left: 50%;
      top: 770px;
      transform: translateX(-50%);
      text-align: center;
      opacity: 0;
      transition: opacity 0.5s ease 0.25s;
    }

    #num {
      font-size: 11px;
      letter-spacing: 0.16em;
      color: var(--mute);
    }

    #name {
      font-family: "Instrument Serif", serif;
      font-style: italic;
      font-weight: 400;
      font-size: 40px;
      line-height: 1.15;
      color: var(--ink);
      margin: 8px 0 6px;
    }

    #price {
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--mute);
      margin-bottom: 18px;
    }

    #close {
      position: absolute;
      right: 46px;
      top: 46px;
      opacity: 0;
      transition: opacity 0.4s ease 0.25s;
      cursor: pointer;
    }

    body.open #prev,
    body.open #next,
    body.open #info,
    body.open #close {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>

      "polygon(45.25% 1.51%,43.29% 3.21%,43.49% 3.58%,45.25% 1.89%,47.02% 1.89%,48.19% 3.02%,48.19% 4.91%,46.43% 6.79%,46.43% 9.06%,43.29% 10.38%,34.46% 11.13%,29.75% 12.26%,28.57% 13.77%,28.18% 15.85%,25.63% 20.94%,25.63% 22.26%,20.13% 25.85%,16.60% 32.64%,13.27% 43.40%,10.32% 55.47%,7.18% 73.77%,6.59% 79.81%,6.59% 87.36%,7.18% 91.13%,8.56% 92.64%,8.36% 97.55%,8.75% 98.11%,16.60% 98.87%,17.97% 93.40%,19.15% 92.45%,19.94% 90.75%,21.70% 90.94%,22.88% 96.98%,23.47% 97.36%,35.44% 96.23%,45.45% 96.42%,46.04% 98.11%,46.62% 97.92%,46.62% 96.60%,47.41% 96.23%,56.44% 96.23%,69.00% 97.36%,69.58% 96.60%,70.57% 91.13%,72.33% 90.94%,73.31% 92.83%,74.29% 93.58%,75.86% 99.06%,83.32% 98.30%,83.71% 97.92%,83.71% 92.83%,84.89% 91.51%,85.48% 88.87%,85.68% 81.13%,85.09% 72.83%,82.34% 55.66%,79.20% 42.45%,76.06% 32.26%,72.72% 25.85%,67.43% 22.26%,67.43% 20.94%,66.05% 18.87%,64.29% 13.02%,61.73% 11.70%,56.83% 10.94%,50.35% 10.57%,48.98% 9.62%,47.02% 9.25%,46.82% 6.98%,48.59% 5.09%,48.78% 3.21%,47.21% 1.51%)"
    ];

    const art = document.getElementById("art");
    const rack = document.getElementById("rack");
    const cap = document.getElementById("cap");
    const capName = document.getElementById("cap-name");
    const capPrice = document.getElementById("cap-price");
    const det = document.getElementById("det");
    const big = document.getElementById("big");
    const big2 = document.getElementById("big2");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");
    const closeBtn = document.getElementById("close");
    const hit = det.querySelector(".hit");
    const numEl = document.getElementById("num");
    const nameEl = document.getElementById("name");
    const priceEl = document.getElementById("price");
    const bandTrack = document.getElementById("band-track");

    /* Scale & Fit Artboard */
    function fit() {
      const k = Math.min(window.innerWidth / 1500, window.innerHeight / 1000);
      art.style.transform = `scale(${k})`;
      art.style.left = `${(window.innerWidth - 1500 * k) / 2}px`;
      art.style.top = `${(window.innerHeight - 1000 * k) / 2}px`;
    }
    window.addEventListener("resize", fit);
    fit();

    /* Marquee Setup (16 repeats of 6 spans) */
    const marqueeItems = ["OFFCUT", "•", "LIMITED RUN", "•", "NO RESTOCKS", "•"];
    let trackHtml = "";
    for (let r = 0; r < 16; r++) {
      for (let i = 0; i < marqueeItems.length; i++) {
        trackHtml += `<span>${marqueeItems[i]}</span>`;
      }
    }
    bandTrack.innerHTML = trackHtml;

    /* Paint helper */
    function paint(el, k) {
      const ew = el.offsetWidth || (el.id === "big" || el.id === "big2" ? 473 : 289);
      const eh = el.offsetHeight || (el.id === "big" || el.id === "big2" ? 492 : 300);
      const col = k % 5;
      const row = Math.floor(k / 5);
      const x_box = col * 409.6 - PAD;
      const y_box = ROWY[row];
      const sx = ew / BW;
      const sy = eh / CH;
      const bg_w = (SW / BW) * ew;
      const bg_h = (SH / CH) * eh;
      const bg_x = -x_box * sx;
      const bg_y = -y_box * sy;

      el.style.backgroundImage = `url("${SHEET_URL}")`;
      el.style.backgroundSize = `${bg_w}px ${bg_h}px`;
      el.style.backgroundPosition = `${bg_x}px ${bg_y}px`;
      el.style.clipPath = POLYGONS[k];
    }

    /* Rack Garment Elements */
    const G = [];
    const SLOT = 108;
    const OPEN = 86;
    const CX = 750;

    let hov = -1;
    let open = -1;

    for (let k = 0; k < N; k++) {
      const g = document.createElement("div");
      g.className = "g";
      const gi = document.createElement("i");
      g.appendChild(gi);
      rack.appendChild(g);
      paint(gi, k);

      g.addEventListener("pointerenter", () => {
        if (open < 0) {
          hov = k;
          layout();
        }
      });

      g.addEventListener("click", () => {
        openG(k);
      });

      G.push(g);
    }

    rack.addEventListener("pointerleave", () => {
      if (open < 0) {
        hov = -1;
        layout();
      }
    });

    /* Layout function */
    function layout() {
      for (let k = 0; k < N; k++) {
        let x = CX + (k - (N - 1) / 2) * SLOT;
        if (hov >= 0 && k !== hov) {
          x += Math.sign(k - hov) * OPEN;
        }
        G[k].style.left = `${x}px`;
        G[k].classList.toggle("face", k === hov);
      }

      if (hov >= 0) {
        cap.style.left = G[hov].style.left;
        capName.textContent = PRODUCTS[hov].name;
        capPrice.textContent = PRODUCTS[hov].price;
        cap.classList.add("on");
      } else {
        cap.classList.remove("on");
      }
    }

    layout();

    /* Detail View helpers */
    function fill(k) {
      numEl.textContent = `${String(k + 1).padStart(2, "0")} / ${String(N).padStart(2, "0")}`;
      nameEl.textContent = PRODUCTS[k].name;
      priceEl.textContent = PRODUCTS[k].price;
    }

    function openG(k) {
      if (open >= 0) return;
      open = k;
      hov = k;
      layout();

      const gx = parseFloat(G[k].style.left);
      big.getAnimations().forEach((a) => a.cancel());
      paint(big, k);
      fill(k);
      document.body.classList.add("open");

      big.animate(
        [
          { transform: `translate(${gx - 750}px, -8px) scale(0.61)`, opacity: 1 },
          { transform: "none", opacity: 1 }
        ],
        { duration: 750, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" }
      );

      G[k].style.visibility = "hidden";
    }

    function step(d) {
      if (open < 0) return;
      const from = open;
      open = (open + d + N) % N;
      fill(open);

      G[from].style.visibility = "";
      G[open].style.visibility = "hidden";
      hov = open;
      layout();

      paint(big2, from);
      big2.animate(
        [
          { transform: "none", opacity: 1, filter: "blur(0)" },
          { transform: `translateX(${-d * 120}px) scale(0.94)`, opacity: 0, filter: "blur(6px)" }
        ],
        { duration: 600, easing: "cubic-bezier(.2,.8,.2,1)", fill: "none" }
      );

      big.getAnimations().forEach((a) => a.cancel());
      paint(big, open);
      big.animate(
        [
          { transform: `translateX(${d * 120}px) scale(0.94)`, opacity: 0, filter: "blur(6px)" },
          { transform: "none", opacity: 1, filter: "blur(0)" }
        ],
        { duration: 600, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" }
      );
    }

    function closeG() {
      if (open < 0) return;
      const k = open;
      const gx = parseFloat(G[k].style.left);

      big.animate(
        [
          { transform: "none", opacity: 1 },
          { transform: `translate(${gx - 750}px, -8px) scale(0.61)`, opacity: 1 }
        ],
        { duration: 650, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" }
      );

      document.body.classList.remove("open");

      setTimeout(() => {
        G[k].style.visibility = "";
        big.getAnimations().forEach((a) => a.cancel());
        big.style.opacity = "0";
        open = -1;
        hov = -1;
        layout();
      }, 650);
    }

    prevBtn.addEventListener("click", () => step(-1));
    nextBtn.addEventListener("click", () => step(1));
    closeBtn.addEventListener("click", () => closeG());
    hit.addEventListener("click", () => closeG());

    window.addEventListener("keydown", (e) => {
      if (open < 0) {
        if (e.key === "ArrowRight") {
          hov = Math.min(N - 1, hov + 1);
          layout();
        } else if (e.key === "ArrowLeft") {
          if (hov < 0) hov = N - 1;
          else hov = Math.max(0, hov - 1);
          layout();
        } else if (e.key === "Enter") {
          if (hov >= 0) openG(hov);
        }
      } else {
        if (e.key === "ArrowRight") {
          step(1);
        } else if (e.key === "ArrowLeft") {
          step(-1);
        } else if (e.key === "Escape") {
          closeG();
        }
      }
    });

    window.__closet = {
      openG,
      step,
      closeG,
      setHov(k) {
        hov = k;
        layout();
      }
    };
  </script>
